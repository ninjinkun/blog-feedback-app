version: 2.1

jobs:
  build:
    docker:
      # Node.js + JDK (JDK 21+ is required by the Firestore emulator)
      - image: cimg/openjdk:21.0-node

    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
            - v3-dependencies-{{ checksum "package-lock.json" }}
            - v3-dependencies-

      - run: npm ci

      - save_cache:
          paths:
            - ~/.npm
          key: v3-dependencies-{{ checksum "package-lock.json" }}

      - restore_cache:
          keys:
            - v3-dependencies-functions-{{ checksum "functions/package-lock.json" }}
            - v3-dependencies-functions-

      - run:
          command: npm ci
          working_directory: functions

      - save_cache:
          paths:
            - functions/node_modules
          key: v3-dependencies-functions-{{ checksum "functions/package-lock.json" }}

      # lint & typecheck
      - run: npm run eslint
      - run: npm run typecheck
      - run:
          command: npm run eslint && npm run typecheck && npm run build
          working_directory: functions

      # run tests against the Firestore emulator
      - run: npx firebase setup:emulators:firestore
      - run:
          command: npx firebase emulators:start --only firestore --project firestore-emulator-example
          background: true
      - run:
          name: Wait for Firestore emulator
          command: |
            for i in $(seq 1 60); do
              nc -z localhost 8080 && exit 0
              sleep 1
            done
            echo "Firestore emulator did not start" && exit 1
      - run: npm run test:ci

      - store_test_results:
          path: ./reports/junit/
      - store_artifacts:
          path: ./reports/junit

      - persist_to_workspace:
          root: .
          paths:
            - .

  deploy_development:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo
    steps:
      - attach_workspace:
          at: .
      - run: npm run build
      - run: npx firebase deploy --project development

  deploy_production:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo
    steps:
      - attach_workspace:
          at: .
      - run: npm run build:production
      - run: npx firebase deploy --project production

workflows:
  test_and_deploy:
    jobs:
      - build:
          filters:
            branches:
              ignore: gh-pages
      - deploy_development:
          requires:
            - build
          filters:
            branches:
              only: master
      - request_manual_testing:
          type: approval
          requires:
            - build
          filters:
            branches:
              only: master
      - deploy_production:
          requires:
            - request_manual_testing
          filters:
            branches:
              only: master
